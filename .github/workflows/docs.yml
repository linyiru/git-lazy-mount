name: docs

# Docs-as-code, convention over configuration: the repo adds ONE config file (kura.toml) + this
# workflow. The Kura CLI reads kura.toml and generates the whole site from the repo's docs/. To keep
# the repo root untouched, the site is built in an isolated ./site dir (docs copied in as content).
# Publishes a static site to gh-pages -> https://<owner>.github.io/git-lazy-mount/
# (In a real setup, the deps + this job collapse into a published `uses: kurajs/pages@v1`.)

on:
  push:
    branches: [main, docs/kura-site]
    paths:
      - "docs/**"
      - "kura.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # peaceiris pushes the built site to the gh-pages branch

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build the Kura docs site from kura.toml
        run: |
          mkdir -p site/content/docs
          cp -R docs/. site/content/docs/
          # docs/README.md is the docs overview -> use it as the site homepage
          [ -f site/content/docs/README.md ] && mv site/content/docs/README.md site/content/docs/index.md
          # Fix links that only resolve inside the repo tree: the project README (repo root) and the
          # bare future-platforms/ folder link (which has no index page).
          sed -i -E "s|\]\(\.\./README\.md\)|](https://github.com/${{ github.repository }}#readme)|g; s|\]\(future-platforms/\)|](future-platforms/windows.md)|g" site/content/docs/index.md
          cp kura.toml site/
          cat > site/package.json <<'JSON'
          {
            "name": "glm-docs", "private": true, "type": "module",
            "scripts": { "build": "kura build --no-embed" },
            "dependencies": { "@kurajs/docs": ">=0.0.45 <0.1.0", "react": "^19.2.0", "react-dom": "^19.2.0" },
            "devDependencies": {
              "@kurajs/cli": ">=0.0.26 <0.1.0", "@tailwindcss/node": "^4.3.1", "@tailwindcss/oxide": "^4.3.1",
              "@tailwindcss/typography": "^0.5.20", "@types/react": "^19.2.0",
              "tailwindcss": "^4.3.1", "typescript": "^5.9.0"
            }
          }
          JSON
          cd site && bun install && bun run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist/static
          commit_message: "docs: publish Kura site (${{ github.sha }})"
